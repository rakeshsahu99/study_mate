<text x="650.958" y="249.0" fill="#38bdf8" font-size="13" font-weight="700">867.3ms</text>
<text x="222" y="346" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Config C: Proposed System</text>
<text x="222" y="362" fill="#64748b" font-size="11" text-anchor="end">Vector + Neural Cross-Encoder</text>
