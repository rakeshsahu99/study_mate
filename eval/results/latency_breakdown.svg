<text x="674.51" y="354.0" fill="#38bdf8" font-size="13" font-weight="700">918.5ms</text>
<rect x="40" y="445" width="740" height="42" fill="#1e293b" rx="6"/>
<text x="410.0" y="471" fill="#f8fafc" font-size="12" text-anchor="middle">
<tspan fill="#f59e0b" font-weight="bold">Key Takeaway: </tspan>
<tspan fill="#cbd5e1">Local ONNX cross-encoder re-ranking adds only </tspan>
<tspan fill="#fbbf24" font-weight="bold">44.8ms (4.9% of total latency)</tspan>
<tspan fill="#cbd5e1"> while boosting retrieval precision by 45% and eliminating 25% noise.</tspan>
</text>
