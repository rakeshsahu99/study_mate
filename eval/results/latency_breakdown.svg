  <text x="163" y="10" fill="#cbd5e1" font-size="12">Retrieval (33ms)</text>
  <rect x="290" y="0" width="12" height="12" fill="#f59e0b" rx="2"/>
  <text x="308" y="10" fill="#fde68a" font-weight="600" font-size="12">ONNX Re-ranking (+45ms)</text>
  <rect x="475" y="0" width="12" height="12" fill="#6366f1" rx="2"/>
  <text x="493" y="10" fill="#cbd5e1" font-size="12">LLM Generation (820ms)</text>
</g>
