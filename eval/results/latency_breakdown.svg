<text x="516.0" y="428" fill="#64748b" font-size="11" text-anchor="middle">600ms</text>
<line x1="608.0" y1="110" x2="608.0" y2="410" stroke="#1e293b" stroke-dasharray="3"/>
<text x="608.0" y="428" fill="#64748b" font-size="11" text-anchor="middle">800ms</text>
