<text x="222" y="257" fill="#64748b" font-size="11" text-anchor="end">FastEmbed + Cosine Similarity</text>
<rect x="240" y="225" width="460" height="38" fill="#111827" rx="5"/>
<rect x="240" y="225" width="6.67" height="38" fill="#818cf8"/>
<rect x="246.67" y="225" width="15.087999999999997" height="38" fill="#38bdf8"/>
